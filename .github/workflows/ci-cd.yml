# CI: every push and pull request — build, unit tests, end-to-end tests on a throwaway Postgres.
# CD: a push to production-ready (after CI passes) deploys the API to the Lightsail server.
#
# Turn deploys on with the repository variable AUTO_DEPLOY = true (Settings → Secrets and
# variables → Actions → Variables) once the secrets below are added.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST         server static IP or hostname
#   SSH_USER         login user (ubuntu)
#   SSH_PRIVATE_KEY  private key of a deploy key in that user's ~/.ssh/authorized_keys
# The server's host keys are pinned in .github/known_hosts.
name: API CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gdkite
          POSTGRES_PASSWORD: gdkite
          POSTGRES_DB: gdkite
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gdkite" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # test/env.ts swaps the database name for gdkite_test and forces safe test providers.
      DATABASE_URL: postgresql://gdkite:gdkite@localhost:5432/gdkite?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
      # The WhatsApp browser is never started in tests.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Test database
        run: PGPASSWORD=gdkite psql -h localhost -U gdkite -d gdkite -c 'CREATE DATABASE gdkite_test'
      - name: Unit tests
        run: npx jest
      - name: End-to-end tests
        run: npm run test:e2e

  deploy:
    needs: test
    # Deploys once the repo variable AUTO_DEPLOY is 'true' (set after adding the secrets).
    if: vars.AUTO_DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/production-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Pasted secrets may carry Windows line endings; strip them.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Server host keys are public and pinned in the repo (refresh: ssh-keyscan <host> | grep -v '^#').
          cp .github/known_hosts ~/.ssh/known_hosts
          # Fail early with a readable reason (annotations are visible without signing in).
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1 ||
            { echo "::error::SSH_PRIVATE_KEY is not a valid private key (copy the whole file, including the BEGIN/END lines)"; exit 1; }
          [ "$TARGET" != "@" ] || { echo "::error::SSH_USER / SSH_HOST secrets are missing"; exit 1; }
          if ! out=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 "$TARGET" 'sudo -n true && echo ok' 2>&1); then
            echo "::error::SSH to the server failed: $(echo "$out" | tail -n 3 | tr '\n' ' ')"
            exit 1
          fi
      - name: Package release
        run: git archive --format=tar.gz -o gdkites-api.tar.gz HEAD
      - name: Upload and install
        env:
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy gdkites-api.tar.gz deploy/deploy-api.sh "$TARGET:/tmp/"
          # Builds on the server and runs `prisma migrate deploy` (see deploy/deploy-api.sh).
          ssh -i ~/.ssh/id_deploy "$TARGET" 'sudo bash /tmp/deploy-api.sh /tmp/gdkites-api.tar.gz && rm -f /tmp/gdkites-api.tar.gz'
      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://api.gdkites.in/api/v1/health; then echo; exit 0; fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1
