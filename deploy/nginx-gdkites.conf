# GD Kites: website + web app on gdkites.in, API on api.gdkites.in.
# HTTPS is added by certbot (certbot --nginx), which edits this file in place on the server.

server {
    listen 80;
    listen [::]:80;
    server_name gdkites.in www.gdkites.in;

    root /var/www/gdkites/website;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
    }

    # Flutter web app (built with --base-href /app/); unknown paths fall back to the app.
    location /app/ {
        alias /var/www/gdkites/app/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
    }

    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gdkites.in;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
