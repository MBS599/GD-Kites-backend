# GD Kites: website on gdkites.in, web app on app.gdkites.in, API on api.gdkites.in.
# HTTPS is added by certbot (certbot --nginx), which edits this file in place on the server.

server {
    listen 80;
    listen [::]:80;
    server_name gdkites.in www.gdkites.in;

    root /var/www/gdkites/website;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compress the web app: main.dart.js is ~4.5 MB raw, ~1.3 MB gzipped.
    # (Ubuntu's nginx.conf has gzip on but only for text/html.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml font/ttf font/otf;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
    }

    # The web app moved to app.gdkites.in; old links keep working.
    location ^~ /app {
        rewrite ^/app/?(.*)$ https://app.gdkites.in/$1 permanent;
    }

    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
    }
}

# GD Kites web app (Flutter web, built with --base-href /). HTTPS added by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name app.gdkites.in;

    root /var/www/gdkites/app;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml font/ttf font/otf;

    # Builds made for the old /app/ address still load here.
    location /app/ {
        alias /var/www/gdkites/app/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Unknown paths are app routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gdkites.in;

    # Product videos are up to 50 MB.
    client_max_body_size 60m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
